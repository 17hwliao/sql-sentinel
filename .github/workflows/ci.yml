name: backend-ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    env: {GOMAXPROCS: '2', GOMEMLIMIT: 3GiB}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - name: Required integration result and OpenAPI inventory contracts
        run: |
          python3 -m pip install -r scripts/requirements-contracts.txt
          python3 scripts/validate-contracts.py
          python3 -m unittest discover -s scripts -p "test_*.py" -v
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: docker build -t sqlsentinel-ci .
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target verify -t backend-integration-runner .
      - name: Required real dependency tests
        run: python3 scripts/verify-integrations.py --runner-image backend-integration-runner

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.2', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - run: docker build -t console-ci .
